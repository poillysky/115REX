<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>115REX</title>
    <meta name="theme-color" content="#176BFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      // 首帧前定主题，避免刷新时先白后黑。键名与 core/theme 保持一致。
      ;(function () {
        try {
          var mode = localStorage.getItem('rex.themeMode')
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          var root = document.documentElement
          root.dataset.theme = mode
          root.dataset.accent = localStorage.getItem('rex.themeAccent') || 'default'
          root.style.colorScheme = mode
        } catch (error) {
          /* 隐私模式下忽略，交给运行时的 initTheme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
